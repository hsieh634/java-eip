# 整合測試：連到同一個 PostgreSQL 容器內的獨立資料庫（不會碰開發資料）
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:renewflow_test}
    # Spring 會快取多個測試 Context，每個都有自己的連線池。預設每個池常駐 10 條連線，
    # T05 前置新增 Context 後總數超過 PostgreSQL 的 max_connections（100，開發後端另占 10）。
    # 常駐只留 2 條、閒置 10 秒後釋放；上限仍是 10，並行測試能用的連線數不變。
    hikari:
      minimum-idle: 2
      idle-timeout: 10000
  flyway:
    # 僅測試允許 clean；實際執行還有 TestFlywayConfig／TestDatabaseGuard 的資料庫名稱檢查把關
    clean-disabled: false

server:
  servlet:
    session:
      cookie:
        # 測試用 HTTP 連線，Secure Cookie 不會被送回
        secure: false

renewflow:
  dev-seed:
    password: ""
  test:
    # 明確允許被 clean 的唯一資料庫。實際連線的資料庫（由資料庫回報）必須與它完全相同
    database: ${DB_TEST_NAME:renewflow_test}
    # 開發資料庫：用來確認它與上面的測試資料庫不是同一個
    dev-database: ${DB_NAME:renewflow}
